services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/collaborative_task_manager
      JWT_SECRET: ${JWT_SECRET:-change_this_dev_secret_before_deploying}
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  mongo_data:
